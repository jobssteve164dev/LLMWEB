x-gitops:
  public_entry:
    service: web
    container_port: 3000
    healthcheck:
      path: /api/health
      expected_json:
        service: llmweb-web
  services:
    control-plane:
      exposure: internal

services:
  control-plane:
    image: llmweb-control-plane:latest
    platform: linux/amd64
    build:
      context: .
      dockerfile: services/control-plane/Dockerfile
    environment:
      LLMWEB_WEB_TOKEN: ${LLMWEB_WEB_TOKEN:-local-dev-token}
      LLMWEB_LEGACY_OWNER_EMAIL: ${LLMWEB_LEGACY_OWNER_EMAIL:-}
      LLMWEB_PUBLIC_URL: ${LLMWEB_PUBLIC_URL:-http://localhost:8000}
      LLMWEB_RUNNER_INSTALLER_URL: ${LLMWEB_RUNNER_INSTALLER_URL:-https://llmweb.szlk.ai/install-runner.sh}
      LLMWEB_RUNNER_SOURCE_REF: ${LLMWEB_RUNNER_SOURCE_REF:-main}
      LLMWEB_CLOUDMCP_OPERATOR_WORKSPACE_ID: ${LLMWEB_CLOUDMCP_OPERATOR_WORKSPACE_ID:-ws_cloudmcp_operator}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    image: llmweb-web:latest
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      LLMWEB_CONTROL_URL: http://control-plane:8000
      LLMWEB_WEB_TOKEN: ${LLMWEB_WEB_TOKEN:-local-dev-token}
      LLMWEB_SESSION_SECRET: ${LLMWEB_SESSION_SECRET:-local-llmweb-session-secret}
      SZLK_PASSPORT_URL: ${SZLK_PASSPORT_URL:-https://passport.szlk.ai}
      SZLK_PASSPORT_SECRET: ${SZLK_PASSPORT_SECRET:-}
      PASSPORT_PRODUCT: ${PASSPORT_PRODUCT:-llmweb}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      SZLKLAWS_BASE_URL: ${SZLKLAWS_BASE_URL:-https://laws.szlk.ai}
      LLMWEB_TRAINING_ENVIRONMENT_VERSION: ${LLMWEB_TRAINING_ENVIRONMENT_VERSION:-0.2.0}
    depends_on:
      - control-plane
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
