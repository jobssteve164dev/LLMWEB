services:
  postgres:
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_DB: llmweb
      POSTGRES_USER: llmweb
      POSTGRES_PASSWORD: ${LLMWEB_POSTGRES_PASSWORD:-local-llmweb-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmweb -d llmweb"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - control-data:/var/lib/postgresql/data

  control-plane:
    build:
      context: .
      dockerfile: services/control-plane/Dockerfile
    environment:
      LLMWEB_DATABASE_URL: postgresql+psycopg://llmweb:${LLMWEB_POSTGRES_PASSWORD:-local-llmweb-password}@postgres:5432/llmweb
      LLMWEB_WEB_TOKEN: ${LLMWEB_WEB_TOKEN:-local-dev-token}
      LLMWEB_PUBLIC_URL: ${LLMWEB_PUBLIC_URL:-http://localhost:8000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      LLMWEB_CONTROL_URL: http://control-plane:8000
      LLMWEB_WEB_TOKEN: ${LLMWEB_WEB_TOKEN:-local-dev-token}
      LLMWEB_ACCESS_ACCOUNT: ${LLMWEB_ACCESS_ACCOUNT:-admin}
      LLMWEB_ACCESS_PASSWORD: ${LLMWEB_ACCESS_PASSWORD:-local-llmweb}
    depends_on:
      - control-plane
    ports:
      - "3000:3000"

volumes:
  control-data:
