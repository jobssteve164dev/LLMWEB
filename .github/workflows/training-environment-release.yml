name: Training Environment Source Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/build-training-environment-release.sh'
      - 'scripts/export-classic-docker-archive.sh'
      - 'scripts/install-runner-package.sh'
      - 'scripts/verify-training-environment-release.sh'
      - 'scripts/check-training-environment*.mjs'
      - 'contracts/training-environment.schema.json'
      - 'runner/**'

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: runner/go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Verify package and consumer source contracts
        run: pnpm check:training-environment
      - name: Verify Runner pairing-file boundary
        run: go -C runner test ./...

# The authoritative executable package is built, signed, verified across image
# stores, and published by GitOps' existing Release Bundle producer. This source
# workflow deliberately has no contents:write permission and cannot publish.
