name: Training Environment Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable semantic version
        required: true
        default: 0.2.0

permissions:
  contents: write

concurrency:
  group: training-environment-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  cpu-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: runner/go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build immutable CPU training environment
        run: bash scripts/build-training-environment-release.sh "${{ inputs.version }}" "$RUNNER_TEMP/release" "$GITHUB_SHA"
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: llmweb/runtime-cpu:${{ inputs.version }}
          format: spdx-json
          output-file: ${{ runner.temp }}/release/llmweb-runtime-cpu-${{ inputs.version }}.spdx.json
      - name: Report all runtime vulnerabilities
        uses: anchore/scan-action@v7
        with:
          image: llmweb/runtime-cpu:${{ inputs.version }}
          fail-build: false
          output-format: table
      - name: Block actionable high vulnerabilities
        uses: anchore/scan-action@v7
        with:
          image: llmweb/runtime-cpu:${{ inputs.version }}
          config: .github/security/training-runtime-grype.yaml
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Validate final release files
        run: |
          python -m pip install check-jsonschema==0.35.0
          check-jsonschema --schemafile contracts/training-environment.schema.json "$RUNNER_TEMP/release/manifest.json"
          test ! -e "$RUNNER_TEMP/release/.git"
          sha256sum "$RUNNER_TEMP/release"/*
          cat "$RUNNER_TEMP/release/build-evidence.txt"
      - name: Publish immutable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: training-env-v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: LLMWEB Training Environment ${{ inputs.version }}
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/release/manifest.json
            ${{ runner.temp }}/release/llmweb-runner-linux-amd64
            ${{ runner.temp }}/release/docker-static-linux-amd64-27.5.1.tgz
            ${{ runner.temp }}/release/llmweb-runtime-cpu-${{ inputs.version }}.tar.gz
            ${{ runner.temp }}/release/llmweb-runtime-cpu-${{ inputs.version }}.spdx.json
            ${{ runner.temp }}/release/build-evidence.txt
