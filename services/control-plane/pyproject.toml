[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmweb-control-plane"
version = "0.1.0"
description = "LLMWEB control plane API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "pydantic-settings==2.14.2",
  "uvicorn[standard]==0.52.1",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.9.1",
  "pytest==9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llmweb_control"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
